<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | E-commerce product page</title>
  <link href='https://fonts.googleapis.com/css?family=Kumbh Sans' rel='stylesheet'>
  <link href="./styles.css" rel="stylesheet">
</head>
<body>
  <main>
    <header>
      <a href="#" id="openMenu"><img src="./images/icon-menu.svg" alt="openMenu"/></a>
      <img src="./images/logo.svg" alt="logo" width="138" height="20"/>
      <nav id="desktopMenu">
        <ul>
          <li><a href="#">Collections</a></li>
          <li><a href="#">Men</a></li>
          <li><a href="#">Women</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">Contact</a></li>
        </ul>
      </nav>
      <img src="./images/icon-cart.svg" alt="cart" width="22" height="20"/>
      <img src="./images/image-avatar.png" alt="avatar" width="50" height="50"/>
    </header>
    <section id="main">
    <section id="productImages">
      <picture>
        <img src="./images/image-product-1.jpg" alt="productImageOne" width="400" height="400"/>
      </picture>
      <section>
        <img src="./images/image-product-1-thumbnail.jpg" alt="imageOne" width="100" height="100"/>
        <img src="./images/image-product-2-thumbnail.jpg" alt="imageTwo" width="100" height="100"/>
        <img src="./images/image-product-3-thumbnail.jpg" alt="imageThree" width="100" height="100"/>
        <img src="./images/image-product-4-thumbnail.jpg" alt="imageFour" width="100" height="100"/>
      </section>
      
    </section>

    <section id="productInfo">
      <span>Sneaker Company</span>
      <h1>Fall Limited Edition Sneakers</h1>
      <p>These low-profile sneakers are your perfect casual wear companion. Featuring a 
  durable rubber outer sole, they’ll withstand everything the weather can offer.</p>
      <h2>$125.00</h2>
      <span>50%</span>
      <p id="originalPrice">$250.00</p>
      <input type="number" placeholder="0" min="0">
      <button><img src="./images/icon-cart.svg" alt="cart"/>Add to cart</button>
    </section>
    </section>
  </main>
</body>
</html>
